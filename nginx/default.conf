server {
    listen 80;
    server_name yubix.tech www.yubix.tech;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name yubix.tech www.yubix.tech;

    ssl_certificate /etc/letsencrypt/live/yubix.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yubix.tech/privkey.pem;

    if (-f /usr/share/nginx/html/maintenance/maintenance.flag) {
        return 503;
    }

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream http://app:9090;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        error_page 502 503 504 /maintenance.html;
    }

    location = /maintenance.html {
        root /usr/share/nginx/html/maintenance;
        internal;
    }

    error_page 503 /maintenance.html;
}
