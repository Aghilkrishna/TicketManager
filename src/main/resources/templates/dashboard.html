<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head('Dashboard')}"></th:block>
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('dashboard', '')}"></aside>
    <div class="main-panel">
        <header th:replace="~{fragments/layout :: topbar('Dashboard', '')}"></header>
        <main class="content-area">

            <!-- Hero welcome banner -->
            <section class="hero-banner glass-card mb-4">
                <div class="d-flex flex-column flex-lg-row justify-content-between gap-3 align-items-start">
                    <div class="d-flex align-items-center gap-3">
                        <div>
                            <img th:if="${profile.profileImageUploaded}" th:src="@{/api/users/profile/picture}" alt="Profile picture" class="rounded-circle border" style="width: 72px; height: 72px; object-fit: cover;">
                            <div th:if="${!profile.profileImageUploaded}" class="rounded-circle border d-flex align-items-center justify-content-center fw-semibold bg-light text-dark" style="width: 72px; height: 72px;"
                                 th:text="${profile.firstName != null && !profile.firstName.isBlank() ? #strings.substring(profile.firstName,0,1).toUpperCase() : #strings.substring(profile.username,0,1).toUpperCase()}">U</div>
                        </div>
                        <div>
                            <div class="text-uppercase small opacity-75">Overview</div>
                            <h1 class="display-6 fw-bold mb-2">Welcome back, <span th:text="${profile.firstName != null && !profile.firstName.isBlank() ? profile.firstName : profile.username}"></span></h1>
                            <p class="mb-0">Monitor open workload, track progress, and react to service updates from a single dashboard.</p>
                        </div>
                    </div>
                    <div class="metric-trend"><i class="bi bi-activity"></i> Realtime operations</div>
                </div>
            </section>

            <!-- Card metrics section -->
            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="h5 mb-0 fw-semibold">Card Metrics</h2>
                    <!-- Admin-only tab toggle -->
                    <div th:if="${currentRoles.contains('ROLE_ADMIN')}" class="btn-group btn-group-sm" role="group">
                        <button id="tabOrg" type="button" class="btn btn-primary" onclick="switchMetricTab('org')">
                            <i class="bi bi-building me-1"></i>Organization
                        </button>
                        <button id="tabUser" type="button" class="btn btn-outline-primary" onclick="switchMetricTab('user')">
                            <i class="bi bi-person me-1"></i>My Tickets
                        </button>
                    </div>
                </div>
                <!-- Org metrics grid: admin only, shown by default -->
                <section th:if="${currentRoles.contains('ROLE_ADMIN')}"
                         id="orgMetricsGrid"
                         class="metric-grid dashboard-metric-grid"></section>
                <!-- User metrics grid: all roles; hidden for admin until tab is clicked -->
                <section id="userMetricsGrid"
                         th:class="${currentRoles.contains('ROLE_ADMIN')} ? 'metric-grid dashboard-metric-grid d-none' : 'metric-grid dashboard-metric-grid'"></section>
            </div>

            <!-- Charts grid — each section gated by its role-feature -->
            <div class="dashboard-charts-grid">

                <!-- Chart 1: My Ticket Status (admin / manager / agent / vendor) -->
                <section th:if="${currentFeatures.contains('FEATURE_DASHBOARD_MY_TICKET_STATUS')}"
                         class="chart-card">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="section-title mb-0">My Ticket Status</div>
                        <span class="metric-trend"><i class="bi bi-arrow-clockwise me-1"></i>Live</span>
                    </div>
                    <div class="chart-donut-wrap">
                        <canvas id="myStatusChart"></canvas>
                    </div>
                </section>

                <!-- Chart 2: All Ticket Status (admin / manager) -->
                <section th:if="${currentFeatures.contains('FEATURE_DASHBOARD_ALL_TICKET_STATUS')}"
                         class="chart-card">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="section-title mb-0">All Ticket Status</div>
                        <span class="metric-trend"><i class="bi bi-arrow-clockwise me-1"></i>Live</span>
                    </div>
                    <div class="chart-donut-wrap">
                        <canvas id="allStatusChart"></canvas>
                    </div>
                </section>

                <!-- Chart 3: User Count (admin only) -->
                <section th:if="${currentFeatures.contains('FEATURE_DASHBOARD_USER_COUNT')}"
                         class="chart-card">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="section-title mb-0">User Count</div>
                        <span class="metric-trend"><i class="bi bi-arrow-clockwise me-1"></i>Live</span>
                    </div>
                    <div class="chart-donut-wrap">
                        <canvas id="userCountChart"></canvas>
                    </div>
                </section>

            </div>
        </main>
    </div>
</div>

<style>
.metric-card-clickable { cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease; }
.metric-card-clickable:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.13); }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<script>
const KNOWN_COLORS = {
  STATUS_LEADS: '#A855F7',
  STATUS_OPEN: '#0072B2',
  STATUS_SITE_VISITED: '#0F766E',
  STATUS_IN_PROGRESS: '#E69F00',
  STATUS_ON_HOLD: '#CC79A7',
  STATUS_FOLLOW_UP: '#EA580C',
  STATUS_SITE_REVISIT: '#166534',
  STATUS_RESOLVED: '#009E73',
  STATUS_CLOSED: '#4B5563',
  STATUS_CANCELLED: '#D55E00'
};

function toDisplayLabel(key) {
  return String(key)
    .toLowerCase()
    .split('_')
    .map(part => part ? part.charAt(0).toUpperCase() + part.slice(1) : '')
    .join(' ')
    .trim();
}

function hashString(value) {
  let hash = 0;
  for (let i = 0; i < value.length; i++) {
    hash = ((hash << 5) - hash) + value.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

function generateColorForKey(key, index) {
  const normalizedKey = String(key || '').toUpperCase();
  if (KNOWN_COLORS[normalizedKey]) {
    return KNOWN_COLORS[normalizedKey];
  }
  // Deterministic HSL color generation for newly-added statuses/roles.
  const hash = hashString(normalizedKey);
  const hue = (hash + (index * 137.508)) % 360;
  const saturation = 68;
  const lightness = 48;
  return `hsl(${hue.toFixed(0)} ${saturation}% ${lightness}%)`;
}

function makeDoughnut(canvas, labels, values, colors, chartType) {
  const chart = new Chart(canvas, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{ data: values, backgroundColor: colors, borderWidth: 2, hoverOffset: 6 }]
    },
    options: {
      cutout: '66%',
      plugins: {
        legend: {
          position: 'bottom',
          labels: { padding: 14, font: { size: 12 }, boxWidth: 13, boxHeight: 13, borderRadius: 4 }
        },
        tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${ctx.parsed}` } }
      },
      animation: { duration: 500 },
      onClick: (event, activeElements) => {
        if (activeElements.length > 0) {
          const index = activeElements[0].index;
          const label = labels[index];
          handleChartClick(chartType, label);
        }
      }
    }
  });
  return chart;
}

function getDashboardScope() {
  const orgGrid = document.getElementById('orgMetricsGrid');
  const userGrid = document.getElementById('userMetricsGrid');
  if (orgGrid && !orgGrid.classList.contains('d-none')) return 'all';
  if (userGrid && !userGrid.classList.contains('d-none')) return 'mine';
  return 'all';
}

function handleChartClick(chartType, label) {
  // Convert display label back to status/role key
  const key = label.toUpperCase().replace(/\s+/g, '_');
  // Read runtime flags and scope
  const isVendor = /*[[${currentRoles.contains('ROLE_VENDOR')}]]*/ false;
  const isAdmin = /*[[${currentRoles.contains('ROLE_ADMIN')}]]*/ false;
  const scope = getDashboardScope();

  switch (chartType) {
    case 'myStatus': {
      if (isVendor) {
        // Vendor: show tickets created by the vendor
        window.location.href = `/tickets?statuses=${key}&createdOnly=true`;
      } else if (isAdmin && scope === 'all') {
        // Admin viewing organization scope: show all tickets for the status
        window.location.href = `/tickets?statuses=${key}&adminScope=true`;
      } else {
        // Default: show assigned/pending tickets for the logged-in user
        window.location.href = `/tickets?statuses=${key}&assignedOnly=true`;
      }
      return;
    }

    case 'allStatus': {
      // All-ticket status chart should navigate to a tickets view filtered by status
      if (isAdmin && scope === 'all') {
        window.location.href = `/tickets?statuses=${key}&adminScope=true`;
      } else if (isVendor) {
        window.location.href = `/tickets?statuses=${key}&createdOnly=true`;
      } else {
        window.location.href = `/tickets?statuses=${key}&assignedOnly=true`;
      }
      return;
    }

    case 'userCount': {
      const userRoleKey = label.toUpperCase().replace(/\s+/g, '_');
      window.location.href = `/admin/users?role=ROLE_${userRoleKey}`;
      return;
    }

    default:
      return;
  }
}

let myStatusChart = null, allStatusChart = null, userCountChart = null;

const STATUS_CARDS = [
  {title: 'Enquiry', icon: 'bi bi-megaphone', statusKey: 'LEADS', tone: 'metric-tone-enquiry'},
  {title: 'Open', icon: 'bi bi-folder2-open', statusKey: 'OPEN', tone: 'metric-tone-open'},
  {title: 'Site Visited', icon: 'bi bi-geo-alt-fill', statusKey: 'SITE_VISITED', tone: 'metric-tone-revisit'},
  {title: 'In Progress', icon: 'bi bi-tools', statusKey: 'IN_PROGRESS', tone: 'metric-tone-progress'},
  {title: 'On Hold', icon: 'bi bi-pause-circle', statusKey: 'ON_HOLD', tone: 'metric-tone-hold'},
  {title: 'Follow Up', icon: 'bi bi-arrow-repeat', statusKey: 'FOLLOW_UP', tone: 'metric-tone-followup'},
  {title: 'Site Revisit', icon: 'bi bi-geo-alt', statusKey: 'SITE_REVISIT', tone: 'metric-tone-revisit'},
  {title: 'Quoted', icon: 'bi bi-file-text', statusKey: 'QUOTED', tone: 'metric-tone-quoted'},
  {title: 'Resolved', icon: 'bi bi-check2-circle', statusKey: 'RESOLVED', tone: 'metric-tone-resolved'},
  {title: 'Closed', icon: 'bi bi-lock', statusKey: 'CLOSED', tone: 'metric-tone-closed'},
  {title: 'Cancelled', icon: 'bi bi-x-circle', statusKey: 'CANCELLED', tone: 'metric-tone-cancelled'},
  {title: 'Total Tickets', icon: 'bi bi-ticket-detailed', statusKey: null, tone: 'metric-tone-total'}
];

const ORG_EXTRA_CARDS = [
  {title: 'Technicians', icon: 'bi bi-person-gear', valueKey: 'technicianCount', tone: 'metric-tone-users', url: '/admin/users?role=ROLE_AGENT'},
  {title: 'Vendors', icon: 'bi bi-person-badge', valueKey: 'vendorCount', tone: 'metric-tone-vendors', url: '/admin/users?role=ROLE_VENDOR'}
];

let orgData = null;
let userData = null;

function formatNum(v) {
  return new Intl.NumberFormat().format(Number(v || 0));
}

function buildCardHtml(title, icon, value, tone, url) {
  const attr = url ? ` data-url="${url}"` : '';
  const cls = url ? ' metric-card-clickable' : '';
  return `<article class="metric-card dashboard-metric-card ${tone}${cls}"${attr}>
    <div class="dashboard-metric-icon"><i class="${icon}"></i></div>
    <div class="dashboard-metric-copy">
      <div class="dashboard-metric-title">${title}</div>
      <div class="metric-value">${formatNum(value)}</div>
    </div>
  </article>`;
}

function renderCards(containerId, payload, urlBuilder) {
  const container = document.getElementById(containerId);
  if (!container) return;

  const statusCounts = payload.statusCounts || {};
  const statusHtml = STATUS_CARDS.map(card => {
    const value = card.statusKey ? (statusCounts[card.statusKey] ?? 0) : (payload.totalTickets ?? 0);
    const url = card.statusKey ? urlBuilder(card.statusKey) : urlBuilder(null);
    return buildCardHtml(card.title, card.icon, value, card.tone, url);
  }).join('');

  const extraHtml = (containerId === 'orgMetricsGrid' ? ORG_EXTRA_CARDS : []).map(card => {
    const value = payload[card.valueKey] ?? 0;
    return buildCardHtml(card.title, card.icon, value, card.tone, card.url);
  }).join('');

  container.innerHTML = statusHtml + extraHtml;

  container.querySelectorAll('[data-url]').forEach(card => {
    card.addEventListener('click', () => {
      window.location.href = card.dataset.url;
    });
  });
}

async function loadOrgMetrics() {
  const container = document.getElementById('orgMetricsGrid');
  if (!container) return;
  try {
    const res = await fetch('/api/dashboard/org-metrics');
    if (!res.ok) return;
    orgData = await res.json();
    renderCards('orgMetricsGrid', orgData, sk => sk
      ? `/tickets?statuses=${sk}&adminScope=true`
      : '/tickets?adminScope=true');
  } catch (e) { console.warn('Org metrics load failed', e); }
}

async function loadUserMetrics() {
  const container = document.getElementById('userMetricsGrid');
  if (!container) return;
  try {
    const res = await fetch('/api/dashboard/user-metrics');
    if (!res.ok) return;
    userData = await res.json();
    renderCards('userMetricsGrid', userData, sk => sk
      ? `/tickets?statuses=${sk}&assignedOnly=true`
      : '/tickets?assignedOnly=true');
  } catch (e) { console.warn('User metrics load failed', e); }
}

function switchMetricTab(tab) {
  const orgGrid = document.getElementById('orgMetricsGrid');
  const userGrid = document.getElementById('userMetricsGrid');
  const tabOrg = document.getElementById('tabOrg');
  const tabUser = document.getElementById('tabUser');

  if (tab === 'org') {
    orgGrid && orgGrid.classList.remove('d-none');
    userGrid && userGrid.classList.add('d-none');
    tabOrg && (tabOrg.className = 'btn btn-primary btn-sm');
    tabUser && (tabUser.className = 'btn btn-outline-primary btn-sm');
    if (!orgData) loadOrgMetrics();
  } else {
    orgGrid && orgGrid.classList.add('d-none');
    userGrid && userGrid.classList.remove('d-none');
    tabOrg && (tabOrg.className = 'btn btn-outline-primary btn-sm');
    tabUser && (tabUser.className = 'btn btn-primary btn-sm');
    if (!userData) loadUserMetrics();
  }

  refreshAll();
}

async function loadCurrentScopeStatusMetrics() {
  const isAdmin = /*[[${currentRoles.contains('ROLE_ADMIN')}]]*/ false;
  const scope = getDashboardScope();
  const endpoint = (isAdmin && scope === 'all') ? '/api/dashboard/org-metrics' : '/api/dashboard/user-metrics';
  const res = await fetch(endpoint);
  if (!res.ok) return null;
  return await res.json();
}

function buildStatusChartSeries(data) {
  const statusCounts = data && typeof data.statusCounts === 'object' ? data.statusCounts : (data || {});
  const keys = Object.keys(statusCounts);
  const labels = keys.map(k => toDisplayLabel(k));
  const values = keys.map(k => Number(statusCounts[k] ?? 0));
  const colors = keys.map((k, i) => generateColorForKey(`STATUS_${k}`, i));
  return { keys, labels, values, colors };
}

function upsertDoughnutChart(chartRef, canvas, chartType, labels, values, colors) {
  if (chartRef) {
    chartRef.data.labels = labels;
    chartRef.data.datasets[0].data = values;
    chartRef.data.datasets[0].backgroundColor = colors;
    chartRef.update();
    return chartRef;
  }
  return makeDoughnut(canvas, labels, values, colors, chartType);
}

async function loadMyTicketStatus() {
  const canvas = document.getElementById('myStatusChart');
  if (!canvas) return;
  try {
    const payload = await loadCurrentScopeStatusMetrics();
    if (!payload) return;
    const { labels, values, colors } = buildStatusChartSeries(payload);
    myStatusChart = upsertDoughnutChart(myStatusChart, canvas, 'myStatus', labels, values, colors);
  } catch (e) { console.warn('My ticket status load failed', e); }
}

async function loadAllTicketStatus() {
  const canvas = document.getElementById('allStatusChart');
  if (!canvas) return;
  try {
    const payload = await loadCurrentScopeStatusMetrics();
    if (!payload) return;
    const { labels, values, colors } = buildStatusChartSeries(payload);
    allStatusChart = upsertDoughnutChart(allStatusChart, canvas, 'allStatus', labels, values, colors);
  } catch (e) { console.warn('All ticket status load failed', e); }
}

async function loadUserCount() {
  const canvas = document.getElementById('userCountChart');
  if (!canvas) return;
  try {
    const res = await fetch('/api/dashboard/user-count');
    if (!res.ok) return;
    const data = await res.json();
    const labels = Object.keys(data);
    const values = labels.map(k => data[k]);
    const colors = labels.map((k, i) => {
      const normalized = String(k).toUpperCase().replace(/\s+/g, '_');
      return generateColorForKey(`ROLE_${normalized}`, i);
    });
    if (userCountChart) {
      userCountChart.data.labels = labels;
      userCountChart.data.datasets[0].data = values;
      userCountChart.data.datasets[0].backgroundColor = colors;
      userCountChart.update();
    } else {
      userCountChart = makeDoughnut(canvas, labels, values, colors, 'userCount');
    }
  } catch (e) { console.warn('User count load failed', e); }
}

async function refreshAll() {
  orgData = null;
  userData = null;

  const orgGrid = document.getElementById('orgMetricsGrid');
  if (orgGrid && !orgGrid.classList.contains('d-none')) {
    loadOrgMetrics();
  } else {
    loadUserMetrics();
  }

  await Promise.all([loadMyTicketStatus(), loadAllTicketStatus(), loadUserCount()]);
}

if (document.getElementById('tabOrg')) {
  loadOrgMetrics();
} else {
  loadUserMetrics();
}

refreshAll();
setInterval(refreshAll, 10000);
</script>
</body>
</html>
