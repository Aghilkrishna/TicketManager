<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head('Reports')}"></th:block>
</head>
<body>
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: sidebar('admin', 'reports')}"></aside>
        <div class="main-panel">
            <header th:replace="~{fragments/layout :: topbar('Reports', 'Generate and download reports')}"></header>
            <main class="content-area">
            <div class="container-fluid">
                <!-- Report Type Selection -->
                <div class="row mb-4">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title mb-0">Report Generation</h5>
                            </div>
                            <div class="card-body">
                                <form id="reportForm">
                                    <div class="row">
                                        <!-- Report Type -->
                                        <div class="col-md-6 mb-3">
                                            <label for="reportType" class="form-label">Report Type</label>
                                            <select class="form-select" id="reportType" name="reportType" required>
                                                <option value="">Select Report Type</option>
                                                <option value="tickets">Tickets Report</option>
                                                <option value="users">Users Report</option>
                                            </select>
                                        </div>
                                        
                                        <!-- Date Range -->
                                        <div class="col-md-6 mb-3">
                                            <label for="dateRange" class="form-label">Date Range</label>
                                            <select class="form-select" id="dateRange" name="dateRange">
                                                <option value="all">All Records</option>
                                                <option value="custom">Custom Date Range</option>
                                                <option value="today">Today</option>
                                                <option value="yesterday">Yesterday</option>
                                                <option value="last7days">Last 7 Days</option>
                                                <option value="last30days">Last 30 Days</option>
                                                <option value="thismonth">This Month</option>
                                                <option value="lastmonth">Last Month</option>
                                            </select>
                                        </div>
                                    </div>
                                    
                                    <!-- Custom Date Range Fields -->
                                    <div class="row" id="customDateRange" style="display: none;">
                                        <div class="col-md-6 mb-3">
                                            <label for="startDate" class="form-label">Start Date</label>
                                            <input type="date" class="form-control" id="startDate" name="startDate">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label for="endDate" class="form-label">End Date</label>
                                            <input type="date" class="form-control" id="endDate" name="endDate">
                                        </div>
                                    </div>
                                    
                                    <!-- Ticket Filters (shown only for tickets report) -->
                                    <div id="ticketFilters" style="display: none;">
                                        <div class="row">
                                            <div class="col-md-4 mb-3">
                                                <label for="ticketStatus" class="form-label">Ticket Status</label>
                                                <select class="form-select" id="ticketStatus" name="ticketStatus">
                                                    <option value="">All Status</option>
                                                    <option value="OPEN">Open</option>
                                                    <option value="IN_PROGRESS">In Progress</option>
                                                    <option value="RESOLVED">Resolved</option>
                                                    <option value="CLOSED">Closed</option>
                                                    <option value="CANCELLED">Cancelled</option>
                                                </select>
                                            </div>
                                            <div class="col-md-4 mb-3">
                                                <label for="ticketPriority" class="form-label">Priority</label>
                                                <select class="form-select" id="ticketPriority" name="ticketPriority">
                                                    <option value="">All Priorities</option>
                                                    <option value="LOW">Low</option>
                                                    <option value="MEDIUM">Medium</option>
                                                    <option value="HIGH">High</option>
                                                    <option value="URGENT">Urgent</option>
                                                </select>
                                            </div>
                                            <div class="col-md-4 mb-3">
                                                <label for="serviceType" class="form-label">Service Type</label>
                                                <select class="form-select" id="serviceType" name="serviceType">
                                                    <option value="">All Service Types</option>
                                                    <option value="STANDARD">Standard</option>
                                                    <option value="VENDOR">Vendor</option>
                                                    <option value="PREMIUM">Premium</option>
                                                    <option value="EMERGENCY">Emergency</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <!-- User Filters (shown only for users report) -->
                                    <div id="userFilters" style="display: none;">
                                        <div class="row">
                                            <div class="col-md-4 mb-3">
                                                <label for="userStatus" class="form-label">User Status</label>
                                                <select class="form-select" id="userStatus" name="userStatus">
                                                    <option value="">All Users</option>
                                                    <option value="enabled">Enabled</option>
                                                    <option value="disabled">Disabled</option>
                                                </select>
                                            </div>
                                            <div class="col-md-4 mb-3">
                                                <label for="emailVerified" class="form-label">Email Verification</label>
                                                <select class="form-select" id="emailVerified" name="emailVerified">
                                                    <option value="">All</option>
                                                    <option value="verified">Verified</option>
                                                    <option value="unverified">Unverified</option>
                                                </select>
                                            </div>
                                            <div class="col-md-4 mb-3">
                                                <label for="userRole" class="form-label">User Role</label>
                                                <select class="form-select" id="userRole" name="userRole">
                                                    <option value="">All Roles</option>
                                                    <option value="ROLE_ADMIN">Admin</option>
                                                    <option value="ROLE_STAFF">Staff</option>
                                                    <option value="ROLE_VENDOR">Vendor</option>
                                                    <option value="ROLE_CUSTOMER">Customer</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <!-- Action Buttons -->
                                    <div class="row">
                                        <div class="col-12">
                                            <button type="button" class="btn btn-primary" id="downloadBtn">
                                                <i class="bi bi-download"></i> Download Excel
                                            </button>
                                            <button type="button" class="btn btn-success" id="emailBtn">
                                                <i class="bi bi-envelope"></i> Send via Email
                                            </button>
                                            <button type="button" class="btn btn-secondary" id="resetBtn">
                                                <i class="bi bi-arrow-clockwise"></i> Reset
                                            </button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Recent Reports -->
                <div class="row">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title mb-0">Recent Reports</h5>
                            </div>
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-striped" id="recentReportsTable">
                                        <thead>
                                            <tr>
                                                <th>Report Type</th>
                                                <th>Generated At</th>
                                                <th>Generated By</th>
                                                <th>Filters Applied</th>
                                                <th>Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <!-- Reports will be populated here -->
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            </main>
        </div>
    </div>
    
    <!-- Email Modal -->
    <div class="modal fade" id="emailModal" tabindex="-1" aria-labelledby="emailModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="emailModalLabel">Send Report via Email</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="emailForm">
                        <div class="mb-3">
                            <label for="recipientEmail" class="form-label">Recipient Email</label>
                            <input type="email" class="form-control" id="recipientEmail" name="recipientEmail" required>
                            <div class="form-text">Separate multiple emails with commas</div>
                        </div>
                        <div class="mb-3">
                            <label for="emailSubject" class="form-label">Subject</label>
                            <input type="text" class="form-control" id="emailSubject" name="emailSubject" readonly>
                        </div>
                        <div class="mb-3">
                            <label for="emailMessage" class="form-label">Message</label>
                            <textarea class="form-control" id="emailMessage" name="emailMessage" rows="3">Please find the attached report.</textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="sendEmailBtn">
                        <i class="bi bi-send"></i> Send Email
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const reportType = document.getElementById('reportType');
            const dateRange = document.getElementById('dateRange');
            const customDateRange = document.getElementById('customDateRange');
            const ticketFilters = document.getElementById('ticketFilters');
            const userFilters = document.getElementById('userFilters');
            const downloadBtn = document.getElementById('downloadBtn');
            const emailBtn = document.getElementById('emailBtn');
            const resetBtn = document.getElementById('resetBtn');
            const emailModal = new bootstrap.Modal(document.getElementById('emailModal'));
            const sendEmailBtn = document.getElementById('sendEmailBtn');
            
            // Show/hide filters based on report type
            reportType.addEventListener('change', function() {
                const value = this.value;
                ticketFilters.style.display = value === 'tickets' ? 'block' : 'none';
                userFilters.style.display = value === 'users' ? 'block' : 'none';
            });
            
            // Show/hide custom date range
            dateRange.addEventListener('change', function() {
                customDateRange.style.display = this.value === 'custom' ? 'block' : 'none';
            });
            
            // Download report
            downloadBtn.addEventListener('click', function() {
                if (!validateForm()) return;
                
                const formData = new FormData(document.getElementById('reportForm'));
                const params = new URLSearchParams();
                
                for (let [key, value] of formData.entries()) {
                    if (value) params.append(key, value);
                }
                
                window.open('/api/admin/reports/download?' + params.toString(), '_blank');
            });
            
            // Email report
            emailBtn.addEventListener('click', function() {
                if (!validateForm()) return;
                
                const reportTypeValue = reportType.value;
                document.getElementById('emailSubject').value = 
                    reportTypeValue.charAt(0).toUpperCase() + reportTypeValue.slice(1) + ' Report';
                
                emailModal.show();
            });
            
            // Send email
            sendEmailBtn.addEventListener('click', function() {
                const formData = new FormData(document.getElementById('reportForm'));
                const emailFormData = new FormData(document.getElementById('emailForm'));
                const params = new URLSearchParams();
                
                for (let [key, value] of formData.entries()) {
                    if (value) params.append(key, value);
                }
                
                for (let [key, value] of emailFormData.entries()) {
                    if (value) params.append(key, value);
                }
                
                fetch('/api/admin/reports/email', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: params.toString()
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('Report sent successfully!');
                        emailModal.hide();
                        loadRecentReports();
                    } else {
                        alert('Error sending report: ' + data.message);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error sending report');
                });
            });
            
            // Reset form
            resetBtn.addEventListener('click', function() {
                document.getElementById('reportForm').reset();
                ticketFilters.style.display = 'none';
                userFilters.style.display = 'none';
                customDateRange.style.display = 'none';
            });
            
            // Validate form
            function validateForm() {
                if (!reportType.value) {
                    alert('Please select a report type');
                    return false;
                }
                
                if (dateRange.value === 'custom') {
                    const startDate = document.getElementById('startDate').value;
                    const endDate = document.getElementById('endDate').value;
                    
                    if (!startDate || !endDate) {
                        alert('Please select both start and end dates');
                        return false;
                    }
                    
                    if (new Date(startDate) > new Date(endDate)) {
                        alert('Start date must be before end date');
                        return false;
                    }
                }
                
                return true;
            }
            
            // Load recent reports
            function loadRecentReports() {
                fetch('/api/admin/reports/recent')
                    .then(response => response.json())
                    .then(data => {
                        const tbody = document.querySelector('#recentReportsTable tbody');
                        tbody.innerHTML = '';
                        
                        data.forEach(report => {
                            const row = tbody.insertRow();
                            row.innerHTML = `
                                <td>${report.reportType}</td>
                                <td>${new Date(report.generatedAt).toLocaleString()}</td>
                                <td>${report.generatedBy}</td>
                                <td>${report.filters}</td>
                                <td>
                                    <button class="btn btn-sm btn-primary" onclick="downloadReport(${report.id})">
                                        <i class="bi bi-download"></i>
                                    </button>
                                </td>
                            `;
                        });
                    })
                    .catch(error => {
                        console.error('Error loading recent reports:', error);
                    });
            }
            
            // Download specific report
            window.downloadReport = function(reportId) {
                window.open('/api/admin/reports/download/' + reportId, '_blank');
            };
            
            // Load recent reports on page load
            loadRecentReports();
            initAppShell();
            initDefaultDateFields();
        });
    </script>
</body>
</html>
